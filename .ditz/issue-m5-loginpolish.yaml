  comment: 'council #25 r2 anthropic nits: (3) if popup=child is set and the login
    screen leaves composition before the next frame, the child WebView''s onRelease
    never runs (GC-only reclaim; very unlikely). (4) pre-existing: MainActivity has
    no configChanges and loginUrl uses remember, not rememberSaveable, so rotating
    mid-sign-in drops the Google hand-off.'
