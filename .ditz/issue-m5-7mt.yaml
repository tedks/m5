- time: 2026-11-12T21:38:48-00:00
  who: Ted Smith
  what: commented
  comment: '2026-11-12: A fresh USB-A replug still failed during descriptor reads
    with error -110; the kernel power-cycled the port and ended unable to enumerate.
    No serial device appeared. Group membership is present in the account database,
    but permissions are downstream of enumeration and cannot explain this failure.
    Next discriminator: a data-capable USB-C cable on a direct port; if that also
    fails, step back to an independent cable/device control rather than repeating
    port variants.'
- time: 2026-11-12T21:39:30-00:00
  who: Ted Smith
  what: commented
  comment: 'Correction to my prior next-test note: a direct C-to-C connection may
    produce no kernel event if this M5 lacks the USB-C attach resistors; that outcome
    would be uninformative about device health. The preferred next control is a known
    low/full-speed USB input device in the same rear USB-A port. If it enumerates
    there, focus on the M5/cable/adapter; if it also fails at descriptor reads, focus
    on the port/hub path. Separately check whether the M5 shows power, and use the
    same M5+cable+adapter on another computer only as a later control if needed.'
- time: 2026-11-12T21:48:15-00:00
  who: Ted Smith
  what: commented
  comment: '2026-11-12 control: the same M5, cable, and adapter enumerated on another
    Ubuntu 24.04.5 desktop as FTDI 0403:6001 (Product M5stack) and created ttyUSB0.
    On framework0, reset and reconnect produced the same descriptor-read -110 timeout
    and no serial node. The failing path is behind a Realtek 0bda:5424 USB 2.0 hub;
    the working host uses a different USB controller and hub chain. This shifts the
    diagnosis toward a framework0 USB path/compatibility issue rather than an M5 firmware
    lockup. Exact cause is not yet isolated. Next targeted test: an existing USB 2.0
    hub or USB-C dock with USB-A downstream port on framework0, if available; no device
    write before enumeration and owner approval.'
