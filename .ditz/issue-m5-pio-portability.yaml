id: m5-pio-portability
title: Assess PlatformIO shell portability and Python availability
desc: 'PR #24 council nits: assess whether the default Nix shell should keep an explicit
  Python command for future developer scripts (current BLE Python test uses the separate
  buildinfra shell, so no current gate breaks), and document or support NixOS hosts
  where platformio-core may need an FHS wrapper for downloaded Xtensa tools. The mission
  targets framework0 and its exact-head firmware build passed, so this is follow-up
  portability work.'
